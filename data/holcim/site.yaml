latitude: 53.88
longitude: 9.58

solar:
  kwp: 6000
  tilt: 20
  azimuth: 0
  performance_ratio: 0.85

wind:
  rated_kw: 4200
  hub_height_m: 120
  power_curve:
    - [0, 0]
    - [3, 0]
    - [4, 130]
    - [5, 370]
    - [6, 730]
    - [7, 1210]
    - [8, 1810]
    - [9, 2500]
    - [10, 3200]
    - [11, 3780]
    - [12, 4120]
    - [13, 4200]
    - [25, 4200]
