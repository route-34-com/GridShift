[project]
name = "gridshift"
version = "0.1.0"
description = "Smart energy scheduling for industry"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "pandas==3.0.6",
    "numpy==2.5.3",
    "scikit-learn==1.9.1",
    "highspy==1.15.1",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "Jinja2==3.1.6",
    "PyYAML==6.0.3",
    "python-dotenv==1.2.4",
    "openpyxl==3.1.5",
    "reportlab==5.0.1",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "aiosmtpd==1.4.6",
    "pypdf==6.19.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
